name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma Client
        run: npx prisma generate
        working-directory: apps/api
      - name: Typecheck API
        run: npm run typecheck
        working-directory: apps/api
      - name: Build API (tsc)
        run: npm run build
        working-directory: apps/api
      - name: Typecheck + Build Web
        run: npm run build
        working-directory: apps/web

  test-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: odonto
          POSTGRES_PASSWORD: odonto_dev_password
          POSTGRES_DB: odonto_study_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://odonto:odonto_dev_password@localhost:5432/odonto_study_test
      JWT_SECRET: ci-test-secret-0123456789abcdef0123456789abcdef
      JWT_REFRESH_SECRET: ci-test-refresh-0123456789abcdef0123456789abcdef
      ENCRYPTION_KEY: ci-test-encryption-0123456789abcdef0123456789ab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma Client
        run: npx prisma generate
        working-directory: apps/api
      - name: Run API tests
        run: npm test
        working-directory: apps/api

# Vercel Preview Deploy (requer secrets VERCEL_TOKEN/VERCEL_ORG_ID/VERCEL_PROJECT_ID)
# O deploy de produção continua automático via integração GitHub-Vercel.
